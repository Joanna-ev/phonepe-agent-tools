services:
  - type: web
    name: phonepe-agent-tools
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ADMIN_TOKEN       # secret for POST /admin/reset; Render generates a random value
        generateValue: true
